<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>도도부현 마스터</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <div id="loginSection">
      <h1>🗾 도도부현 마스터</h1>
      <p>로그인하고 암기 학습을 시작하세요!</p>
      <form id="loginForm">
        <div class="input-group">
          <label for="username">아이디</label>
          <input type="text" id="username" placeholder="아이디를 입력하세요" required>
        </div>
        <div class="input-group">
          <label for="password">비밀번호</label>
          <input type="password" id="password" placeholder="비밀번호를 입력하세요" required>
        </div>
        <button type="submit" class="btn-primary">학습 시작하기</button>
      </form>
    </div>

    <div id="quizSection" class="hidden">
      <div class="quiz-header">문제 <span id="currentNum">1</span> / <span id="totalNum">3</span></div>
      <div class="question" id="questionText">문제가 여기에 표시됩니다.</div>
      <div class="options" id="optionsContainer">
        </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
