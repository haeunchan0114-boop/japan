<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>도도부현 마스터</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <div id="loginSection">
      <h1>🗾 도도부현 마스터</h1>
      <p>로그인하고 암기 학습을 시작하세요!</p>
      <form id="loginForm">
        <div class="input-group">
          <label for="loginEmail">이메일 (아이디)</label>
          <input type="email" id="loginEmail" placeholder="example@email.com" required>
        </div>
        <div class="input-group">
          <label for="loginPassword">비밀번호</label>
          <input type="password" id="loginPassword" placeholder="비밀번호 입력" required>
        </div>
        <button type="submit" class="btn-primary">로그인</button>
      </form>
      <p class="toggle-text">계정이 없으신가요? <a href="#" id="toSignup">회원가입</a></p>
    </div>

    <div id="signupSection" class="hidden">
      <h1>✨ 회원가입</h1>
      <p>새 계정을 생성하여 학습 기록을 관리하세요!</p>
      <form id="signupForm">
        <div class="input-group">
          <label for="signupEmail">이메일</label>
          <input type="email" id="signupEmail" placeholder="example@email.com" required>
        </div>
        <div class="input-group">
          <label for="signupPassword">비밀번호 (6자 이상)</label>
          <input type="password" id="signupPassword" placeholder="비밀번호 입력" required>
        </div>
        <button type="submit" class="btn-primary">가입하기</button>
      </form>
      <p class="toggle-text">이미 계정이 있으신가요? <a href="#" id="toLogin">로그인</a></p>
    </div>

    <div id="quizSection" class="hidden">
      <div class="quiz-header">문제 <span id="currentNum">1</span> / <span id="totalNum">3</span></div>
      <div class="question" id="questionText">문제가 여기에 표시됩니다.</div>
      <div class="options" id="optionsContainer">
        </div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
