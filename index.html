<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Japan Prefecture Quiz 2.0</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <div id="loginSection">
      <h1>🗾 japan quiz</h1>
      <p style="font-size: 0.85rem; color: #555; margin-bottom: 20px;">
        47개 도도부현 정밀 실루엣 학습 시스템
      </p>
      <form id="loginForm">
        <div class="input-group">
          <label for="loginId">아이디</label>
          <input type="text" id="loginId" placeholder="아이디 입력" required>
        </div>
        <div class="input-group">
          <label for="loginPassword">비밀번호</label>
          <input type="password" id="loginPassword" placeholder="비밀번호 입력" required>
        </div>
        <button type="submit" class="btn-primary">로그인</button>
      </form>
      <p class="toggle-text">계정이 없으신가요? <a href="#" id="toSignup">회원가입</a></p>
    </div>

    <div id="signupSection" class="hidden">
      <h1>✨ 회원가입</h1>
      <form id="signupForm">
        <div class="input-group">
          <label for="signupId">아이디</label>
          <input type="text" id="signupId" placeholder="아이디 입력" required>
        </div>
        <div class="input-group">
          <label for="signupPassword">비밀번호</label>
          <input type="password" id="signupPassword" placeholder="비밀번호 입력" required>
        </div>
        <button type="submit" class="btn-primary">가입하기</button>
      </form>
      <p class="toggle-text">이미 계정이 있으신가요? <a href="#" id="toLogin">로그인</a></p>
    </div>

    <div id="setupSection" class="hidden">
      <h1>⚙️ 퀴즈 설정</h1>
      
      <div class="setup-group">
        <label>🌐 언어 및 문제 모드</label>
        <select id="langMode">
          <option value="ko_ko">한국어 문제 - 한국어 정답</option>
          <option value="jp_jp">일본어 문제 - 일본어 정답</option>
          <option value="ko_jp">한국어 문제 - 일본어 정답 (학습 모드)</option>
        </select>
      </div>

      <div class="setup-group" style="margin-top: 15px;">
        <label>📝 문제 개수</label>
        <select id="questionCount">
          <option value="5">5문제 (빠른 복습)</option>
          <option value="10">10문제 (표준)</option>
          <option value="20">20문제 (심화)</option>
          <option value="47">47문제 (전국 마스터)</option>
        </select>
      </div>

      <button id="startQuizBtn" class="btn-primary" style="margin-top: 25px;">퀴즈 시작!</button>
    </div>

    <div id="quizSection" class="hidden">
      <div class="quiz-header">문제 <span id="currentNum">1</span> / <span id="totalNum">?</span></div>
      
      <div class="silhouette-container">
        <canvas id="shapeCanvas" width="240" height="200"></canvas>
      </div>

      <div class="question" id="questionText">이 모양의 지역은 어디일까요?</div>
      <div class="options" id="optionsContainer"></div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
