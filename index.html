<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>japan quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <div id="loginSection">
      <h1>🗾 japan quiz</h1>
      <p style="font-size: 0.85rem; color: #555; margin-bottom: 20px;">
        일본 도도부현 실루엣 퀴즈 서비스
      </p>

      <form id="loginForm">
        <div class="input-group">
          <label for="loginId">아이디</label>
          <input type="text" id="loginId" placeholder="아이디 입력" required>
        </div>
        <div class="input-group">
          <label for="loginPassword">비밀번호</label>
          <input type="password" id="loginPassword" placeholder="비밀번호 입력" required>
        </div>
        <button type="submit" class="btn-primary">로그인</button>
      </form>
      <p class="toggle-text">계정이 없으신가요? <a href="#" id="toSignup">회원가입</a></p>
    </div>

    <div id="signupSection" class="hidden">
      <h1>✨ 회원가입</h1>
      <p>새 계정을 생성하여 학습 기록을 관리하세요!</p>
      <form id="signupForm">
        <div class="input-group">
          <label for="signupId">아이디 (영문/숫자)</label>
          <input type="text" id="signupId" placeholder="아이디 입력" required>
        </div>
        <div class="input-group">
          <label for="signupPassword">비밀번호 (6자 이상)</label>
          <input type="password" id="signupPassword" placeholder="비밀번호 입력" required>
        </div>
        <button type="submit" class="btn-primary">가입하기</button>
      </form>
      <p class="toggle-text">이미 계정이 있으신가요? <a href="#" id="toLogin">로그인</a></p>
    </div>

    <div id="modeSection" class="hidden">
      <h1>🌐 언어 모드 선택</h1>
      <p>풀고 싶은 퀴즈의 언어를 선택해 주세요.</p>
      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button id="langKoBtn" class="btn-primary" style="flex: 1;">🇰🇷 한국어 버전</button>
        <button id="langJpBtn" class="btn-primary" style="flex: 1;">🇯🇵 日本語 バージョン</button>
      </div>
    </div>

    <div id="quizSection" class="hidden">
      <div class="quiz-header">문제 <span id="currentNum">1</span> / <span id="totalNum">3</span></div>
      
      <div style="text-align: center; background: #f8fafc; border-radius: 12px; padding: 15px; margin: 15px 0; border: 1px solid #e2e8f0;">
        <canvas id="shapeCanvas" width="200" height="160" style="background: #ffffff; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);"></canvas>
      </div>

      <div class="question" id="questionText">이 모양의 도도부현은 어디일까요?</div>
      
      <div class="options" id="optionsContainer"></div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
