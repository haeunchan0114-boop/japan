<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="google-site-verification: google1729ec3ae17d1b11.html">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>japan quiz</title>
  <meta name="google-site-verification" content="kPVztduf5jlB1DhWI7kru3Y8WA2COFXMwX9fYRkHecg" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <div id="loginSection">
      <h1>🗾 japan quiz</h1>
      
      <p class="app-description" style="font-size: 0.85rem; color: #555; margin-bottom: 20px; word-break: keep-all;">
        <strong>japan quiz</strong>는 일본의 47개 도도부현 지리 지식을 재미있는 퀴즈로 학습하고 암기할 수 있도록 돕는 웹 서비스입니다.
      </p>

      <button id="googleLoginBtn" class="btn-google">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo">
        Google계정으로 로그인
      </button>

      <div class="divider"><span>또는</span></div>

      <form id="loginForm">
        <div class="input-group">
          <label for="loginId">아이디</label>
          <input type="text" id="loginId" placeholder="아이디 입력" required>
        </div>
        <div class="input-group">
          <label for="loginPassword">비밀번호</label>
          <input type="password" id="loginPassword" placeholder="비밀번호 입력" required>
        </div>
        <button type="submit" class="btn-primary">로그인</button>
      </form>
      <p class="toggle-text">계정이 없으신가요? <a href="#" id="toSignup">회원가입</a></p>
    </div>

    <div id="signupSection" class="hidden">
      <h1>✨ 회원가입</h1>
      <p>새 계정을 생성하여 학습 기록을 관리하세요!</p>
      <form id="signupForm">
        <div class="input-group">
          <label for="signupId">아이디 (영문/숫자)</label>
          <input type="text" id="signupId" placeholder="아이디 입력" required>
        </div>
        <div class="input-group">
          <label for="signupPassword">비밀번호 (6자 이상)</label>
          <input type="password" id="signupPassword" placeholder="비밀번호 입력" required>
        </div>
        <button type="submit" class="btn-primary">가입하기</button>
      </form>
      <p class="toggle-text">이미 계정이 있으신가요? <a href="#" id="toLogin">로그인</a></p>
    </div>

    <div id="quizSection" class="hidden">
      <div class="quiz-header">문제 <span id="currentNum">1</span> / <span id="totalNum">3</span></div>
      <div class="question" id="questionText">문제가 여기에 표시됩니다.</div>
      <div class="options" id="optionsContainer">
        </div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
