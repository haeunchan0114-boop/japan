<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Japan Quiz 3.1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <div id="loadingSection">로그인 상태 확인 중...</div>

    <div id="loginSection" class="hidden">
      <h1>🗾 Japan Quiz</h1>
      <p>실루엣과 힌트로 배우는 일본 도도부현</p>
      <form id="loginForm">
        <div class="input-group"><label>아이디</label><input type="text" id="loginId" required></div>
        <div class="input-group"><label>비밀번호</label><input type="password" id="loginPassword" required></div>
        <button type="submit" class="btn-primary">로그인</button>
      </form>
      <div style="margin-top: 1rem; font-size: 0.85rem;">
        계정이 없나요? <span id="toSignup" style="color:var(--primary); cursor:pointer; font-weight:700;">회원가입</span>
      </div>
    </div>

    <div id="signupSection" class="hidden">
      <h1>✨ 회원가입</h1>
      <form id="signupForm">
        <div class="input-group"><label>아이디</label><input type="text" id="signupId" required></div>
        <div class="input-group"><label>비밀번호</label><input type="password" id="signupPassword" required></div>
        <button type="submit" class="btn-primary">가입하기</button>
      </form>
      <div id="toLogin" style="margin-top:1.5rem; color:gray; cursor:pointer; font-size:0.85rem;">로그인으로 돌아가기</div>
    </div>

    <div id="setupSection" class="hidden">
      <h1>⚙️ 퀴즈 설정</h1>
      <p>학습 모드를 선택하세요</p>
      <div class="setup-group">
        <select id="langMode">
          <option value="ko_ko">한국어 문제 - 한국어 정답</option>
          <option value="jp_jp">일본어 문제 - 일본어 정답</option>
          <option value="ko_jp">한국어 문제 - 일본어 정답</option>
        </select>
      </div>
      <div class="setup-group" style="margin-top:1rem">
        <select id="questionCount">
          <option value="5">5문제</option>
          <option value="10">10문제</option>
          <option value="20">20문제</option>
          <option value="47">전국 47개 마스터</option>
        </select>
      </div>
      <button id="startQuizBtn" class="btn-primary" style="margin-top:2rem">시작하기</button>
      <div id="logoutBtn" class="logout-link">로그아웃</div>
    </div>

    <div id="quizSection" class="hidden">
      <div style="font-size:0.8rem; font-weight:700; color:var(--primary);">문제 <span id="currentNum">1</span> / <span id="totalNum">5</span></div>
      
      <div class="silhouette-container">
        <canvas id="shapeCanvas" width="240" height="200"></canvas>
      </div>

      <div class="hint-box" style="background: #f8f9fa; padding: 12px; border-radius: 8px; margin-bottom: 1rem; text-align: left; font-size: 0.85rem; border: 1px dashed #cbd5e1;">
        <div id="hint1" style="color: #475569; margin-bottom: 6px; display:none;">📍 <b>1단계 힌트 (지방):</b> <span id="hintText1"></span></div>
        <div id="hint2" style="color: #475569; margin-bottom: 6px; display:none;">✨ <b>2단계 힌트 (특산물):</b> <span id="hintText2"></span></div>
        <div id="hint3" style="color: #475569; display:none;">🏙️ <b>3단계 힌트 (유명 장소):</b> <span id="hintText3"></span></div>
        <div id="noHintMsg" style="color: #94a3b8; text-align: center; font-style: italic;">버튼을 눌러 힌트를 확인하세요!</div>
      </div>
      
      <button id="nextHintBtn" style="background:#e2e8f0; color:#334155; border:none; padding:8px 12px; border-radius:6px; font-size:0.8rem; font-weight:600; cursor:pointer; margin-bottom:1.2rem; width:100%;">💡 힌트 보기 (클릭)</button>

      <div id="questionText" style="font-weight:700; margin-bottom:1rem;">이곳은 어디일까요?</div>
      <div id="optionsContainer"></div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
