<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>개인정보처리방침</title>
  <style>
    body { font-family: sans-serif; line-height: 1.6; padding: 30px; max-width: 800px; margin: 0 auto; color: #333; }
    h1 { border-bottom: 2px solid #333; padding-bottom: 10px; }
    h2 { margin-top: 20px; }
  </style>
</head>
<body>
  <h1>개인정보처리방침</h1>
  <p>본 서비스(도도부현 마스터)는 사용자의 개인정보를 중요시하며, 관련 법령을 준수합니다.</p>
  
  <h2>1. 수집하는 개인정보 항목</h2>
  <p>구글 로그인 및 서비스 이용 과정에서 아래와 같은 정보가 수집될 수 있습니다.</p>
  <ul>
    <li>이메일 주소, 프로필 이름</li>
  </ul>

  <h2>2. 개인정보의 수집 및 이용 목적</h2>
  <p>수집한 개인정보는 다음의 목적을 위해 활용합니다.</p>
  <ul>
    <li>사용자 식별 및 로그인 상태 유지</li>
    <li>퀴즈 학습 기록 관리</li>
  </ul>

  <h2>3. 개인정보의 보유 및 파기</h2>
  <p>원칙적으로 개인정보 수집 및 이용목적이 달성된 후에는 해당 정보를 지체 없이 파기합니다.</p>
</body>
</html>
